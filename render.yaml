services:
  - type: web
    name: gambito-dama-cuantico
    env: python
    plan: free
    buildCommand: >-
      set -e ;
      pip install -r requirements.txt ;
      cd frontend && npm ci && npm run build && cd .. ;
      cd engine/stockfish/src && make -j2 build ARCH=x86-64 && ./stockfish bench 16 1 6 > /dev/null
    startCommand: python server.py
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: NODE_VERSION
        value: "20"
      # Obligatorias para multijugador online (configúralas en el dashboard de Render)
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # La API verifica el JWT con las credenciales públicas del mismo proyecto.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: STOCKFISH_POOL_SIZE
        value: "2"
      - key: STOCKFISH_QUEUE_TIMEOUT
        value: "3"
      # Render termina TLS en su proxy: confiar en X-Forwarded-For para que el
      # limitador de peticiones vea la IP real del cliente.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: RATE_LIMIT_ENGINE_PER_MINUTE
        value: "60"
      # Gates de seguridad: activar solo tras las pruebas descritas en
      # docs/STATUS.md.
      - key: FEATURE_AUTHORITATIVE_QUANTUM
        value: "0"
      - key: VITE_FEATURE_SUPPORTER
        value: "0"
